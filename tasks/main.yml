---
# tasks file for remi

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Install remi repository
  ansible.builtin.package:
    name: "{{ remi_repository }}"
    state: present
    disable_gpg_check: true
  register: remi_repository_install
  until:
    - remi_repository_install is succeeded
  retries: 5
  delay: 15
  notify:
    - Reset php stream
    - Enable repository
  when:
    - ansible_facts['distribution'] in [ "CentOS", "Fedora", "RedHat", "Rocky" ]

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
